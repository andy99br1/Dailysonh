name: Build Independent Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "logo.svg"
      - "site.webmanifest"
      - "termo/index.html"
      - "termo/termo.css"
      - "termo/termo.js"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-independent-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK with bundled game interface
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk musica-do-dia.apk
          ls -lh musica-do-dia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musica-do-dia-app
          path: musica-do-dia.apk
          if-no-files-found: error
          retention-days: 30

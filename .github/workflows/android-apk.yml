name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: android-app
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk musica-do-dia.apk
          ls -lh musica-do-dia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musica-do-dia-apk
          path: musica-do-dia.apk
          if-no-files-found: error
          retention-days: 30

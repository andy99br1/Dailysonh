name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-native-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect latest reveal audio
        shell: bash
        run: |
          REVEAL_FILE=$(python3 - <<'PY'
          import json
          with open("catalog.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)
          songs = data.get("songs", [])
          song = songs[-1]
          reveal_index = song.get("challengeRounds", len(song.get("rounds", [])) - 1)
          rounds = song.get("rounds", [])
          if reveal_index >= len(rounds):
              reveal_index = len(rounds) - 1
          print(rounds[reveal_index])
          PY
          )
          echo "Reveal file: $REVEAL_FILE"
          echo "--- Repository file ---"
          ls -lh "$REVEAL_FILE"
          file "$REVEAL_FILE" || true
          sha256sum "$REVEAL_FILE"

          PUBLIC_URL="https://musicadodia.com/$REVEAL_FILE"
          echo "--- Public URL: $PUBLIC_URL ---"
          if curl -L --fail --silent --show-error -D /tmp/reveal-headers.txt \
            "$PUBLIC_URL?native-diagnostic=1" -o /tmp/reveal-public.ogg; then
            cat /tmp/reveal-headers.txt
            ls -lh /tmp/reveal-public.ogg
            file /tmp/reveal-public.ogg || true
            sha256sum /tmp/reveal-public.ogg
          else
            echo "PUBLIC_REVEAL_DOWNLOAD_FAILED"
            exit 1
          fi

          python3 -m pip install --quiet soundfile numpy
          REVEAL_FILE="$REVEAL_FILE" python3 - <<'PY'
          import os, hashlib
          import numpy as np
          import soundfile as sf

          for label, path in [
              ("repository", os.environ["REVEAL_FILE"]),
              ("public", "/tmp/reveal-public.ogg"),
          ]:
              data, rate = sf.read(path, always_2d=True, dtype="float32")
              peak = float(np.max(np.abs(data))) if data.size else 0.0
              rms = float(np.sqrt(np.mean(np.square(data)))) if data.size else 0.0
              duration = len(data) / rate if rate else 0.0
              print(
                  f"AUDIO {label}: rate={rate} channels={data.shape[1]} "
                  f"frames={len(data)} duration={duration:.3f}s peak={peak:.6f} rms={rms:.6f}"
              )
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build native debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk musica-do-dia-native.apk
          ls -lh musica-do-dia-native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musica-do-dia-native-apk
          path: musica-do-dia-native.apk
          if-no-files-found: error
          retention-days: 30

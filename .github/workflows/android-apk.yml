name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-native-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inspect latest reveal audio
        shell: bash
        run: |
          REVEAL_FILE=$(python3 - <<'PY'
          import json
          with open("catalog.json", "r", encoding="utf-8") as fh:
              data = json.load(fh)
          songs = data.get("songs", [])
          song = songs[-1]
          reveal_index = song.get("challengeRounds", len(song.get("rounds", [])) - 1)
          rounds = song.get("rounds", [])
          if reveal_index >= len(rounds):
              reveal_index = len(rounds) - 1
          print(rounds[reveal_index])
          PY
          )
          echo "Reveal file: $REVEAL_FILE"
          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error \
              -show_entries stream=codec_name,codec_type,sample_rate,channels \
              -show_entries format=duration,size,bit_rate \
              -of default=noprint_wrappers=1 "$REVEAL_FILE"
            ffmpeg -hide_banner -nostats -i "$REVEAL_FILE" -af volumedetect -f null - 2>&1 \
              | grep -E "mean_volume|max_volume" || true
          else
            echo "ffprobe not available on runner"
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Android SDK 35
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build native debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk musica-do-dia-native.apk
          ls -lh musica-do-dia-native.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: musica-do-dia-native-apk
          path: musica-do-dia-native.apk
          if-no-files-found: error
          retention-days: 30

name: Process daily song

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "URL da música no YouTube"
        required: true
        type: string
      date:
        description: "Data do desafio (YYYY-MM-DD). Vazio = hoje no Brasil"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dailysonh-audio
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Deno for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r requirements.txt

      - name: Start YouTube PO token provider
        run: |
          docker pull brainicism/bgutil-ytdlp-pot-provider:2.0.0
          docker run --rm -d --name bgutil-provider             -p 127.0.0.1:4416:4416             brainicism/bgutil-ytdlp-pot-provider:2.0.0
          sleep 3
          docker ps --filter name=bgutil-provider

      - name: Process song
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          SONG_DATE: ${{ inputs.date }}
        run: |
          python scripts/process_song.py --url "$YOUTUBE_URL" --date "$SONG_DATE"

      - name: Stop PO token provider
        if: always()
        run: docker rm -f bgutil-provider || true

      - name: Commit generated game assets
        run: |
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json songs/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "Add daily song ${SONG_DATE:-today}"
          git push

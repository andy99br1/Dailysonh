name: Process daily song

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "URL da música no YouTube"
        required: true
        type: string
      date:
        description: "Data do desafio (YYYY-MM-DD). Vazio = hoje no Brasil"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dailysonh-audio
  cancel-in-progress: false

jobs:
  process:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Deno for YouTube extraction
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio
          pip install -r requirements.txt

      - name: Process song
        shell: pwsh
        env:
          YOUTUBE_URL: ${{ inputs.youtube_url }}
          SONG_DATE: ${{ inputs.date }}
        run: |
          python scripts/process_song.py --url "$env:YOUTUBE_URL" --date "$env:SONG_DATE"

      - name: Commit generated game assets
        shell: pwsh
        run: |
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json songs/
          $changes = git diff --cached --name-only
          if (-not $changes) {
            Write-Host "Nenhuma alteração para publicar."
            exit 0
          }
          $date = if ($env:SONG_DATE) { $env:SONG_DATE } else { "today" }
          git commit -m "Add daily song $date"
          git push
        env:
          SONG_DATE: ${{ inputs.date }}

name: Process uploaded audio

on:
  workflow_dispatch:
    inputs:
      audio_path:
        description: "Caminho do áudio no repo. Vazio = pega o arquivo mais recente de incoming/"
        required: false
        type: string
      title:
        description: "Título da música (opcional)"
        required: false
        type: string
      artist:
        description: "Artista (opcional)"
        required: false
        type: string
      date:
        description: "Data do desafio (YYYY-MM-DD). Vazio = hoje no Brasil"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dailysonh-upload
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio torchcodec
          pip install -r requirements.txt

      - name: Select uploaded audio
        id: audio
        shell: bash
        env:
          REQUESTED_PATH: ${{ inputs.audio_path }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_PATH" ]; then
            FILE="$REQUESTED_PATH"
          else
            FILE="$(find incoming -maxdepth 1 -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.m4a' -o -iname '*.flac' -o -iname '*.ogg' -o -iname '*.aac' \) -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          fi
          if [ -z "${FILE:-}" ] || [ ! -f "$FILE" ]; then
            echo "Nenhum áudio encontrado em incoming/."
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "Áudio selecionado: $FILE"

      - name: Process audio
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
          SONG_TITLE: ${{ inputs.title }}
          SONG_ARTIST: ${{ inputs.artist }}
          SONG_DATE: ${{ inputs.date }}
        run: |
          python scripts/process_upload.py             --file "$AUDIO_FILE"             --title "$SONG_TITLE"             --artist "$SONG_ARTIST"             --date "$SONG_DATE"

      - name: Commit generated game assets
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
          SONG_DATE: ${{ inputs.date }}
        run: |
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json songs/
          git rm --ignore-unmatch "$AUDIO_FILE"
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "Process uploaded song ${SONG_DATE:-today}"
          git push

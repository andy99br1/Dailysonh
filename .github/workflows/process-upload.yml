name: Process uploaded audio

on:
  workflow_dispatch:
    inputs:
      audio_path:
        description: "Caminho do áudio no repo. Vazio = pega o arquivo mais recente de incoming/"
        required: false
        type: string
      title:
        description: "Título da música (opcional)"
        required: false
        type: string
      artist:
        description: "Artista (opcional)"
        required: false
        type: string
      date:
        description: "Data do desafio (YYYY-MM-DD). Vazio = hoje no Brasil"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dailysonh-upload
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Demucs models
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: demucs-htdemucs-ft-v1

      - name: Cache BS-Roformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/audio-separator-models
          key: bs-roformer-viperx-1297-v1

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio torchcodec
          pip install -r requirements.txt

      - name: Install isolated BS-Roformer environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/audio-separator-env"
          "$RUNNER_TEMP/audio-separator-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install "audio-separator[cpu]==0.47.0"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/audio-separator-env/bin/audio-separator" >> "$GITHUB_ENV"

      - name: Select uploaded audio
        id: audio
        shell: bash
        env:
          REQUESTED_PATH: ${{ inputs.audio_path }}
        run: |
          set -euo pipefail
          FILE=""
          REMOVE_FILE=""
          ORIGINAL_PATH=""

          recover_from_latest_upload() {
            local wanted="${1:-}"
            local commit=""
            local path=""

            while IFS= read -r candidate_commit; do
              [ -z "$candidate_commit" ] && continue

              while IFS=$'\t' read -r status candidate_path; do
                [ -z "${candidate_path:-}" ] && continue

                if [[ ! "$candidate_path" =~ \.(mp3|wav|m4a|flac|ogg|aac)$ ]]; then
                  continue
                fi

                # Só considera arquivos adicionados/modificados por upload.
                if [[ "$status" != A && "$status" != M ]]; then
                  continue
                fi

                if [ -n "$wanted" ] && [ "$candidate_path" != "$wanted" ]; then
                  continue
                fi

                commit="$candidate_commit"
                path="$candidate_path"
                break 2
              done < <(git diff-tree --no-commit-id --name-status -r "$candidate_commit" -- incoming/)
            done < <(git log --format='%H' -- incoming/)

            if [ -z "$commit" ] || [ -z "$path" ]; then
              return 1
            fi

            ORIGINAL_PATH="$path"

            if [ -f "$path" ]; then
              FILE="$path"
              REMOVE_FILE="$path"
            else
              RECOVERED="$RUNNER_TEMP/$(basename "$path")"
              git show "$commit:$path" > "$RECOVERED"
              FILE="$RECOVERED"
            fi

            echo "Último upload encontrado: $path"
            echo "Commit do upload: $commit"
          }

          # Se o usuário informar um caminho, usa exatamente esse arquivo,
          # inclusive recuperando a versão mais recente dele do histórico.
          if [ -n "$REQUESTED_PATH" ]; then
            if [ -f "$REQUESTED_PATH" ]; then
              FILE="$REQUESTED_PATH"
              REMOVE_FILE="$REQUESTED_PATH"
              ORIGINAL_PATH="$REQUESTED_PATH"
            else
              recover_from_latest_upload "$REQUESTED_PATH" || true
            fi
          fi

          # Vazio = sempre escolhe o upload mais recente de verdade pela ordem
          # dos commits, nunca pela data do arquivo no runner.
          if [ -z "$FILE" ]; then
            recover_from_latest_upload "" || true
          fi

          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "Nenhum áudio enviado foi encontrado no histórico de incoming/."
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "remove_file=$REMOVE_FILE" >> "$GITHUB_OUTPUT"
          echo "original_path=$ORIGINAL_PATH" >> "$GITHUB_OUTPUT"
          echo "Áudio selecionado: $ORIGINAL_PATH"

      - name: Process audio
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
          SONG_TITLE: ${{ inputs.title }}
          SONG_ARTIST: ${{ inputs.artist }}
          SONG_DATE: ${{ inputs.date }}
        run: |
          python scripts/process_upload.py             --file "$AUDIO_FILE"             --title "$SONG_TITLE"             --artist "$SONG_ARTIST"             --date "$SONG_DATE"

      - name: Commit generated game assets
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
          REMOVE_FILE: ${{ steps.audio.outputs.remove_file }}
          SONG_DATE: ${{ inputs.date }}
        run: |
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json songs/
          if [ -n "$REMOVE_FILE" ] && [ -f "$REMOVE_FILE" ]; then
            git rm --ignore-unmatch "$REMOVE_FILE"
          fi
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "Process uploaded song ${SONG_DATE:-today}"
          git push

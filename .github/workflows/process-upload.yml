name: Process uploaded audio

on:
  workflow_dispatch:
    inputs:
      audio_path:
        description: "Caminho do áudio no repo. Vazio = pega o arquivo mais recente de incoming/"
        required: false
        type: string
      title:
        description: "Título da música (opcional)"
        required: false
        type: string
      artist:
        description: "Artista (opcional)"
        required: false
        type: string
      date:
        description: "Data do desafio (YYYY-MM-DD). Vazio = hoje no Brasil"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dailysonh-upload
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Demucs models
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: demucs-htdemucs-ft-v1

      - name: Cache BS-Roformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/audio-separator-models
          key: bs-roformer-viperx-1297-v1

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio torchcodec
          pip install -r requirements.txt

      - name: Install isolated BS-Roformer environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/audio-separator-env"
          "$RUNNER_TEMP/audio-separator-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install "audio-separator[cpu]==0.47.0"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/audio-separator-env/bin/audio-separator" >> "$GITHUB_ENV"

      - name: Select uploaded audio
        id: audio
        shell: bash
        env:
          REQUESTED_PATH: ${{ inputs.audio_path }}
        run: |
          set -euo pipefail
          FILE=""
          REMOVE_FILE=""

          if [ -n "$REQUESTED_PATH" ] && [ -f "$REQUESTED_PATH" ]; then
            FILE="$REQUESTED_PATH"
            REMOVE_FILE="$REQUESTED_PATH"
          fi

          if [ -z "$FILE" ]; then
            FILE="$(find incoming -maxdepth 1 -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.m4a' -o -iname '*.flac' -o -iname '*.ogg' -o -iname '*.aac' \) -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2- || true)"
            if [ -n "$FILE" ]; then
              REMOVE_FILE="$FILE"
            fi
          fi

          # Se o upload já foi processado e removido, recupera o áudio mais recente
          # do histórico apenas para permitir reprocessar com um algoritmo novo.
          if [ -z "$FILE" ]; then
            DELETED="$(git log --all --diff-filter=D --name-only --pretty=format: -- incoming | grep -Ei '\.(mp3|wav|m4a|flac|ogg|aac)$' | head -n 1 || true)"
            if [ -n "$DELETED" ]; then
              DELETE_COMMIT="$(git log --all --diff-filter=D --format='%H' -- "$DELETED" | head -n 1)"
              RECOVERED="$RUNNER_TEMP/$(basename "$DELETED")"
              git show "${DELETE_COMMIT}^:${DELETED}" > "$RECOVERED"
              FILE="$RECOVERED"
              echo "Áudio recuperado do histórico: $DELETED"
            fi
          fi

          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "Nenhum áudio encontrado em incoming/ nem no histórico recente."
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "remove_file=$REMOVE_FILE" >> "$GITHUB_OUTPUT"
          echo "Áudio selecionado: $FILE"

      - name: Process audio
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
          SONG_TITLE: ${{ inputs.title }}
          SONG_ARTIST: ${{ inputs.artist }}
          SONG_DATE: ${{ inputs.date }}
        run: |
          python scripts/process_upload.py             --file "$AUDIO_FILE"             --title "$SONG_TITLE"             --artist "$SONG_ARTIST"             --date "$SONG_DATE"

      - name: Commit generated game assets
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
          REMOVE_FILE: ${{ steps.audio.outputs.remove_file }}
          SONG_DATE: ${{ inputs.date }}
        run: |
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json songs/
          if [ -n "$REMOVE_FILE" ] && [ -f "$REMOVE_FILE" ]; then
            git rm --ignore-unmatch "$REMOVE_FILE"
          fi
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "Process uploaded song ${SONG_DATE:-today}"
          git push

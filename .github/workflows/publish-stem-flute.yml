name: Publish Stem + Flute song

on:
  push:
    branches: [main]
    paths:
      - ".stem-flute-lab/publish.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: dailysonh-publish-stem-flute
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Validate Stem + Flute result
        run: |
          set -euo pipefail
          test -f .stem-flute-lab/publish.json
          test -f stem-flute-lab/manifest.json
          for FILE in drums bass instruments guitar piano other flute original; do
            test -f "stem-flute-lab/$FILE.ogg"
          done

      - name: Publish official challenge
        run: |
          python - <<'PY'
          import json
          import shutil
          import subprocess
          from pathlib import Path

          root = Path(".")
          lab = root / "stem-flute-lab"
          request = json.loads((root / ".stem-flute-lab/publish.json").read_text(encoding="utf-8"))
          manifest = json.loads((lab / "manifest.json").read_text(encoding="utf-8"))

          title = str(request.get("title", "")).strip()
          artist = str(request.get("artist", "")).strip()
          date = str(request.get("date", "")).strip()

          if not title or not artist:
              raise SystemExit("Título e artista são obrigatórios.")
          if len(date) != 10 or date[4] != "-" or date[7] != "-":
              raise SystemExit("Data inválida.")

          expected_created_at = str(request.get("expectedCreatedAt", "")).strip()
          actual_created_at = str(manifest.get("createdAt", "")).strip()
          if expected_created_at and expected_created_at != actual_created_at:
              raise SystemExit(
                  "O resultado do laboratório mudou depois do pedido de publicação. "
                  "Atualize a página e confirme novamente."
              )

          layer_files = {
              "drums": lab / "drums.ogg",
              "bass": lab / "bass.ogg",
              "instruments": lab / "instruments.ogg",
              "guitar": lab / "guitar.ogg",
              "piano": lab / "piano.ogg",
              "other": lab / "other.ogg",
              "flute": lab / "flute.ogg",
          }
          layer_labels = {
              "drums": "Bateria",
              "bass": "Baixo",
              "instruments": "Instrumentos completos",
              "guitar": "Guitarra / violão",
              "piano": "Piano / teclas",
              "other": "Outros instrumentos",
              "flute": "Melodia / flauta",
          }

          requested_layers = request.get("selectedLayers")
          if not isinstance(requested_layers, list):
              requested_layers = ["drums", "bass", "instruments", "flute"]

          selected_layers = []
          for item in requested_layers:
              item = str(item).strip()
              if item in layer_files and item not in selected_layers:
                  selected_layers.append(item)

          if not selected_layers:
              raise SystemExit("Selecione pelo menos uma camada.")
          if len(selected_layers) > 6:
              raise SystemExit("Máximo de 6 camadas antes da revelação.")
          if "instruments" in selected_layers and any(
              item in selected_layers for item in ("guitar", "piano", "other")
          ):
              raise SystemExit(
                  "Use Instrumentos completos OU guitarra/piano/outros separados, não os dois modos juntos."
              )

          for layer in selected_layers:
              if not layer_files[layer].exists():
                  raise SystemExit(f"Camada ausente: {layer}")

          reveal = lab / "original.ogg"
          if not reveal.exists():
              raise SystemExit("Trecho original para revelação não encontrado.")

          catalog_path = root / "catalog.json"
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          songs = catalog.setdefault("songs", [])

          existing_index = next(
              (i for i, song in enumerate(songs) if str(song.get("date", "")) == date),
              None,
          )
          existing = songs[existing_index] if existing_index is not None else None
          try:
              version = max(1, int((existing or {}).get("version", 0)) + 1)
          except Exception:
              version = 2 if existing else 1

          dest = root / "songs" / date
          if dest.exists():
              shutil.rmtree(dest)
          dest.mkdir(parents=True, exist_ok=True)

          def render_mix(inputs, output):
              inputs = [Path(item) for item in inputs]
              cmd = ["ffmpeg", "-y", "-v", "error"]
              for item in inputs:
                  cmd += ["-i", str(item)]

              if len(inputs) == 1:
                  cmd += [
                      "-map", "0:a:0",
                      "-c:a", "libvorbis", "-q:a", "8",
                      str(output),
                  ]
              else:
                  chains = []
                  refs = []
                  for index in range(len(inputs)):
                      tag = f"a{index}"
                      chains.append(f"[{index}:a]aresample=44100,volume=1.0[{tag}]")
                      refs.append(f"[{tag}]")
                  chains.append(
                      "".join(refs)
                      + f"amix=inputs={len(inputs)}:duration=longest:normalize=0,"
                      + "alimiter=limit=0.92[out]"
                  )
                  cmd += [
                      "-filter_complex", ";".join(chains),
                      "-map", "[out]",
                      "-c:a", "libvorbis", "-q:a", "8",
                      str(output),
                  ]
              subprocess.run(cmd, check=True)

          cumulative = []
          for index, layer in enumerate(selected_layers, start=1):
              cumulative.append(layer_files[layer])
              render_mix(cumulative, dest / f"round-{index}.ogg")

          reveal_index = len(selected_layers) + 1
          shutil.copy2(reveal, dest / f"round-{reveal_index}.ogg")

          incoming_labels = request.get("selectedLayerLabels")
          if not isinstance(incoming_labels, list):
              incoming_labels = []

          round_labels = []
          for index, layer in enumerate(selected_layers):
              custom = ""
              if index < len(incoming_labels):
                  custom = str(incoming_labels[index] or "").strip()[:42]
              round_labels.append(custom or layer_labels[layer])
          round_labels.append("Revelação")
          total_rounds = len(selected_layers) + 1

          entry = {
              "date": date,
              "title": title,
              "artist": artist,
              "clipStart": manifest.get("clipStart", 0),
              "source": "stem-flute",
              "sourceName": manifest.get("sourceName", ""),
              "version": version,
              "challengeRounds": len(selected_layers),
              "safeRevealRound": len(selected_layers),
              "roundLabels": round_labels,
              "rounds": [f"songs/{date}/round-{n}.ogg" for n in range(1, total_rounds + 1)],
              "releaseYear": str(request.get("releaseYear", "")).strip(),
              "youtubeViews": str(request.get("youtubeViews", "")).strip(),
              "difficulty": str(request.get("difficulty", "")).strip(),
              "youtubeUrl": str(request.get("youtubeUrl", "")).strip(),
              "coverUrl": str(request.get("coverUrl", "")).strip(),
              "spotifyUrl": str(request.get("spotifyUrl", "")).strip(),
              "appleMusicUrl": str(request.get("appleMusicUrl", "")).strip(),
              "deezerUrl": str(request.get("deezerUrl", "")).strip(),
              "stemFluteCreatedAt": actual_created_at,
              "stemFluteSeparationModel": manifest.get("separationModel", ""),
              "stemFluteVoiceTransform": manifest.get("voiceTransform", ""),
              "stemFluteLayers": selected_layers,
          }

          if existing:
              if "communityStats" in existing:
                  entry["communityStats"] = existing["communityStats"]
              if "statsEndpoint" in existing:
                  entry["statsEndpoint"] = existing["statsEndpoint"]

          if existing_index is None:
              songs.append(entry)
          else:
              songs[existing_index] = entry

          songs.sort(key=lambda item: str(item.get("date", "")))
          catalog_path.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(entry, ensure_ascii=False, indent=2))
          PY

      - name: Commit official song
        run: |
          set -euo pipefail
          SONG_DATE="$(python -c 'import json; print(json.load(open(".stem-flute-lab/publish.json"))["date"])')"

          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add catalog.json "songs/$SONG_DATE/"

          if git diff --cached --quiet; then
            echo "Nada para publicar."
            exit 0
          fi

          git commit -m "Publish Stem + Flute song for $SONG_DATE"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Publish latest catalog to Pages
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main

name: Recover song 2026-09-23

on:
  push:
    paths:
      - ".recovery/retry-2026-09-23.txt"

permissions:
  contents: write

concurrency:
  group: dailysonh-upload
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Demucs models
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: demucs-htdemucs-ft-v1

      - name: Cache BS-Roformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/audio-separator-models
          key: bs-roformer-viperx-1297-v1

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio torchcodec
          pip install -r requirements.txt

      - name: Install isolated BS-Roformer environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/audio-separator-env"
          "$RUNNER_TEMP/audio-separator-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install "audio-separator[cpu]==0.47.0"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/audio-separator-env/bin/audio-separator" >> "$GITHUB_ENV"

      - name: Process recovered audio
        run: |
          python scripts/process_upload.py \
            --file "incoming/1790129697892-Por-Onde-Andei-Videoclipe-oficial-Nando-Reis-e-Os-Infernais-Nando-Reis-youtube.mp3" \
            --title "Por Onde Andei" \
            --artist "Nando Reis e Os Infernais" \
            --date "2026-09-23" \
            --release-year "2004" \
            --clip-start "137.0" \
            --youtube-views "29 milhões" \
            --difficulty "Médio" \
            --youtube-url "" \
            --spotify-url "" \
            --apple-music-url "" \
            --deezer-url ""

      - name: Publish recovered song
        run: |
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json songs/
          git rm --ignore-unmatch "incoming/1790129697892-Por-Onde-Andei-Videoclipe-oficial-Nando-Reis-e-Os-Infernais-Nando-Reis-youtube.mp3"
          git commit -m "Recover processed song 2026-09-23"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

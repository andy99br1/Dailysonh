name: Stem + Flute laboratory

on:
  workflow_dispatch:
    inputs:
      audio_path:
        description: "Caminho do MP3/áudio enviado pelo painel"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: stem-flute-lab
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Cache Demucs model
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: demucs-htdemucs-6s-v1

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install "numpy<2" "demucs==4.0.1" "librosa>=0.10,<0.12" "soundfile>=0.12" "scipy>=1.10"

      - name: Validate upload
        id: audio
        shell: bash
        env:
          AUDIO_PATH: ${{ inputs.audio_path }}
        run: |
          set -euo pipefail
          if [ -z "$AUDIO_PATH" ]; then
            echo "audio_path vazio"
            exit 1
          fi
          if [ ! -f "$AUDIO_PATH" ]; then
            echo "Arquivo não encontrado: $AUDIO_PATH"
            exit 1
          fi
          case "${AUDIO_PATH,,}" in
            *.mp3|*.wav|*.m4a|*.flac|*.ogg|*.aac) ;;
            *)
              echo "Formato não suportado: $AUDIO_PATH"
              exit 1
              ;;
          esac
          echo "file=$AUDIO_PATH" >> "$GITHUB_OUTPUT"

      - name: Choose 18s, split stems and transform voice to flute
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
        run: |
          python scripts/stem_flute_lab.py --file "$AUDIO_FILE"

      - name: Commit isolated lab result
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stem-flute-lab/

          if [ -f "$AUDIO_FILE" ]; then
            git rm --ignore-unmatch "$AUDIO_FILE"
          fi

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi

          git commit -m "Update isolated stem flute lab result"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

name: Stem + Flute laboratory

on:
  push:
    branches: [main]
    paths:
      - ".stem-flute-lab/request.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stem-flute-lab
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Cache separation models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/hub/checkpoints
            ~/.cache/audio-separator-models
          key: stem-flute-hybrid-roformer-v1

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio torchcodec
          pip install "numpy<2" "demucs==4.0.1" "librosa>=0.10,<0.12" "soundfile>=0.12" "scipy>=1.10"

      - name: Install isolated BS-RoFormer environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/audio-separator-env"
          "$RUNNER_TEMP/audio-separator-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install "audio-separator[cpu]==0.47.0"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/audio-separator-env/bin/audio-separator" >> "$GITHUB_ENV"

      - name: Read request and recover upload
        id: audio
        shell: bash
        run: |
          set -euo pipefail
          test -f .stem-flute-lab/request.json

          AUDIO_PATH="$(python -c 'import json; print(json.load(open(".stem-flute-lab/request.json")).get("sourcePath",""))')"
          if [ -z "$AUDIO_PATH" ]; then
            echo "Pedido sem sourcePath."
            exit 1
          fi

          FILE=""
          REMOVE_FILE=""

          if [ -f "$AUDIO_PATH" ]; then
            FILE="$AUDIO_PATH"
            REMOVE_FILE="$AUDIO_PATH"
          else
            COMMIT=""
            while IFS= read -r CANDIDATE; do
              [ -z "$CANDIDATE" ] && continue
              if git cat-file -e "$CANDIDATE:$AUDIO_PATH" 2>/dev/null; then
                COMMIT="$CANDIDATE"
                break
              fi
            done < <(git log --format='%H' -- "$AUDIO_PATH")

            if [ -z "$COMMIT" ]; then
              echo "Não encontrei o upload no histórico: $AUDIO_PATH"
              exit 1
            fi

            FILE="$RUNNER_TEMP/$(basename "$AUDIO_PATH")"
            git show "$COMMIT:$AUDIO_PATH" > "$FILE"
            echo "Áudio recuperado do histórico: $COMMIT"
          fi

          case "${AUDIO_PATH,,}" in
            *.mp3|*.wav|*.m4a|*.flac|*.ogg|*.aac) ;;
            *)
              echo "Formato não suportado: $AUDIO_PATH"
              exit 1
              ;;
          esac

          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "remove_file=$REMOVE_FILE" >> "$GITHUB_OUTPUT"
          echo "source_path=$AUDIO_PATH" >> "$GITHUB_OUTPUT"

      - name: Choose 18s, split stems and transform voice to flute
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
        run: |
          python scripts/stem_flute_lab.py --file "$AUDIO_FILE"

      - name: Commit isolated lab result
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
          REMOVE_FILE: ${{ steps.audio.outputs.remove_file }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stem-flute-lab/

          if [ -n "$REMOVE_FILE" ] && [ -f "$REMOVE_FILE" ]; then
            git rm --ignore-unmatch "$REMOVE_FILE"
          fi

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi

          git commit -m "Update isolated stem flute lab result"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

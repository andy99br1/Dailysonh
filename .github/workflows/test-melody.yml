name: Melody expression lab

on:
  workflow_dispatch:
    inputs:
      audio_path:
        description: "Arquivo do laboratório. Vazio = recupera o último lab-incoming do histórico."
        required: false
        type: string
      title:
        description: "Título opcional"
        required: false
        type: string
      artist:
        description: "Artista opcional"
        required: false
        type: string
      clip_start:
        description: "Início em segundos. Vazio = reutiliza o último teste."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".melody-test/request.json"

permissions:
  contents: write

concurrency:
  group: dailysonh-melody-lab
  cancel-in-progress: false

jobs:
  melody:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache BS-Roformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/audio-separator-models
          key: bs-roformer-viperx-1297-v1

      - name: FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio torchcodec
          pip install -r requirements.txt
          pip install "torchcrepe>=0.0.23,<0.1"

      - name: Install isolated BS-Roformer environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/audio-separator-env"
          "$RUNNER_TEMP/audio-separator-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install --index-url https://download.pytorch.org/whl/cpu torch
          "$RUNNER_TEMP/audio-separator-env/bin/pip" install "audio-separator[cpu]==0.47.0"
          echo "AUDIO_SEPARATOR_BIN=$RUNNER_TEMP/audio-separator-env/bin/audio-separator" >> "$GITHUB_ENV"

      - name: Recover latest laboratory audio
        id: audio
        shell: bash
        env:
          REQUESTED_PATH: ${{ inputs.audio_path || '' }}
        run: |
          set -euo pipefail
          FILE=""

          recover_from_history() {
            local wanted="${1:-}"
            local commit=""
            local path=""

            while IFS= read -r candidate_commit; do
              [ -z "$candidate_commit" ] && continue

              while IFS=$'\t' read -r status candidate_path; do
                [ -z "${candidate_path:-}" ] && continue
                if [[ ! "$candidate_path" =~ \.(mp3|wav|m4a|flac|ogg|aac)$ ]]; then
                  continue
                fi
                if [[ "$status" != A && "$status" != M ]]; then
                  continue
                fi
                if [ -n "$wanted" ] && [ "$candidate_path" != "$wanted" ]; then
                  continue
                fi
                commit="$candidate_commit"
                path="$candidate_path"
                break 2
              done < <(git -c core.quotePath=false diff-tree --no-commit-id --name-status -r "$candidate_commit" -- lab-incoming/)
            done < <(git log --format='%H' -- lab-incoming/)

            if [ -z "$commit" ] || [ -z "$path" ]; then
              return 1
            fi

            RECOVERED="$RUNNER_TEMP/$(basename "$path")"
            git show "$commit:$path" > "$RECOVERED"
            FILE="$RECOVERED"
            echo "Recuperado: $path"
          }

          if [ -n "$REQUESTED_PATH" ] && [ -f "$REQUESTED_PATH" ]; then
            FILE="$REQUESTED_PATH"
          elif [ -n "$REQUESTED_PATH" ]; then
            recover_from_history "$REQUESTED_PATH" || true
          fi

          if [ -z "$FILE" ]; then
            recover_from_history "" || true
          fi

          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            echo "Nenhum áudio do laboratório foi encontrado."
            exit 1
          fi

          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Generate melody comparison
        env:
          AUDIO_FILE: ${{ steps.audio.outputs.file }}
          SONG_TITLE: ${{ inputs.title || '' }}
          SONG_ARTIST: ${{ inputs.artist || '' }}
          CLIP_START: ${{ inputs.clip_start || '' }}
        run: |
          python scripts/test_melody.py \
            --file "$AUDIO_FILE" \
            --title "$SONG_TITLE" \
            --artist "$SONG_ARTIST" \
            --clip-start "$CLIP_START"

      - name: Publish melody result
        run: |
          git config user.name "dailysonh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add separation-tests/melody/

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi

          git commit -m "Update melody expression laboratory result"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#f6efe3">
  <title>Dailysonh</title>
  <link rel="stylesheet" href="styles.css?v=20260922-1">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="icon-btn brand-mark" aria-hidden="true">♪</div>
      <div class="brand">
        <h1>Dailysonh</h1>
        <p>Adivinhe a música, uma camada por vez</p>
      </div>
      <div class="day-chip" id="dayChip">#—</div>
    </header>

    <section class="game-card" id="gameCard" aria-live="polite">
      <div class="game-title">Adivinhe a música tocada pela banda</div>

      <div class="info-card">
        <div class="info-item">
          <span>Desafio</span>
          <strong id="challengeNumber">#—</strong>
        </div>
        <div class="info-item info-item-wide">
          <span>Data</span>
          <strong id="songDate">Carregando…</strong>
        </div>
        <div class="info-item">
          <span>Etapa</span>
          <strong id="roundLabel">Faixa 1 de 5</strong>
        </div>
      </div>

      <div class="rounds" id="rounds">
        <div class="round active"><span>1</span><small>Bateria</small></div>
        <div class="round"><span>2</span><small>Baixo</small></div>
        <div class="round"><span>3</span><small>Instrumentos</small></div>
        <div class="round"><span>4</span><small>Melodia</small></div>
        <div class="round"><span>5</span><small>Revelação</small></div>
      </div>

      <div class="visualizer" id="visualizer" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="player-area">
        <div class="player-controls">
          <button class="circle-btn side-control" id="prevBtn" type="button" disabled aria-label="Faixa anterior">↶</button>
          <button class="play-btn" id="playBtn" type="button" disabled aria-label="Tocar trecho">▶</button>
          <button class="circle-btn side-control" id="skipBtn" type="button" disabled aria-label="Próxima faixa">↷</button>
        </div>

        <div class="audio-progress">
          <input class="seek-bar" id="seekBar" type="range" min="0" max="1000" value="0" disabled aria-label="Progresso do áudio">
          <div class="time-row">
            <span id="elapsedTime">0:00</span>
            <span id="remainingTime">0:18 restantes</span>
          </div>
        </div>
      </div>

      <form class="guess-form" id="guessForm">
        <label for="guessInput">Qual é a música?</label>
        <div class="guess-row">
          <input id="guessInput" autocomplete="off" placeholder="Digite o nome da música" disabled>
          <button type="submit" id="guessBtn" disabled>Adivinhar</button>
        </div>
      </form>

      <div class="attempts" id="attempts"></div>
      <div class="message" id="message"></div>

      <section class="reveal hidden" id="reveal">
        <p class="reveal-kicker">A música era</p>
        <h2 id="revealTitle"></h2>
        <p id="revealArtist"></p>
        <div class="reveal-actions">
          <a id="youtubeLink" target="_blank" rel="noopener">Abrir no YouTube</a>
          <button class="secondary" id="shareBtn" type="button">Compartilhar</button>
          <button class="secondary" id="restartBtn" type="button">Jogar novamente</button>
        </div>
      </section>
    </section>

    <footer class="footer-note">
      <span>🎵 Dailysonh</span>
      <span>Uma música por dia</span>
    </footer>
  </main>

  <script src="app.js?v=20260922-1"></script>
</body>
</html>
